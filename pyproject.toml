[project]
name = "unhalted"
version = "0.1.0"
description = "Mandate lifecycle recovery agent. The model diagnoses; a deterministic shell decides."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "jinja2>=3.1",
    "httpx>=0.27",
    "razorpay>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-bdd>=8.1", "ruff>=0.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/unhalted"]

[tool.pytest.ini_options]
testpaths = ["tests"]
bdd_features_base_dir = "tests/features"
addopts = "-q --strict-markers -m 'not live'"
markers = [
    "live: hits the real Razorpay API. Requires test credentials in .env. Run with -m live.",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
