name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Drift is checked when a developer asks for it: on every push and pull
  # request, and on demand from the Actions tab before a release or when a
  # circular lands. That is the trigger that matches how this rule actually
  # changes — somebody notices a policy update and comes to check.
  workflow_dispatch:

  # An unattended daily check, deliberately left off.
  #
  # It is the right trigger for a service somebody is running, and the wrong one
  # here: this repository will be quiet between bursts of work, GitHub disables
  # scheduled workflows after 60 days without activity, and a daily run nobody
  # is watching decays into a red badge that means nothing. A watcher people
  # learn to ignore is worse than no watcher.
  #
  # Uncomment when this is deployed and someone is on the other end of it.
  #
  # schedule:
  #   - cron: "30 1 * * *"   # 01:30 UTC = 07:00 IST, before the working day

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.13
      - run: uv sync --all-extras
      - name: Lint
        run: uv run ruff check .
      - name: Specification suite
        run: uv run pytest

  changelog:
    # The local hook can be bypassed with --no-verify. This cannot.
    # A pull request must carry a changelog entry, or say in a commit message
    # why it does not.
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require a changelog entry
        run: |
          base="origin/${{ github.base_ref }}"
          if ! git diff --quiet "$base"...HEAD -- CHANGELOG.md; then
            echo "CHANGELOG.md updated."
            exit 0
          fi
          if git log "$base"..HEAD --format=%B | grep -qF "[skip changelog]"; then
            echo "No changelog entry, but a commit declares [skip changelog]."
            exit 0
          fi
          echo "::error::This pull request changes code but adds no CHANGELOG.md entry."
          echo "Add one under ## [Unreleased], or put [skip changelog] in a commit message."
          exit 1

  taxonomy-drift:
    # The diagnosis taxonomy's facts are generated from Razorpay's error
    # references and pinned to a commit of their docs. When they document a new
    # root cause, confidence for that reason should fall and more cases should
    # route to a human — but only if we notice. This is how we notice.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.13
      - run: uv sync --all-extras
      - name: Razorpay's error documentation has not moved
        run: uv run python scripts/build_taxonomy.py --check
